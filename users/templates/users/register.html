{%extends 'base.html' %}

{%block content%}
    <h1>Регистрация</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p>Уже существует профиль? <a href="{% url 'users-login' %}">Войти</a></p>

    {%if form.errors %}
    <p style="color: red;">Неверное имя пользователя или пароль.</p>
    {%endif%}
{% endblock %}
