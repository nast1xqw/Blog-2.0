{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Мой блог{% endblock %}</title>
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a href="/" class="nav__logo">Мой блог</a>
            <div class="nav__links">
                <a href="#">Главная</a>
                <a href="#">О сайте</a>
                <a href="{% url 'posts-create' %}">Создать</a>
                {% if user.is_authenticated %}
                    <a href="#">Профиль</a>
                    <form action="{% url 'users-logout' %}" method="post" class="nav__logout">
                        {% csrf_token %}
                        <button type="submit">Выход</button>
                    </form>
                {% else %}
                    <a href="{% url 'users-login' %}">Вход</a>
                    <a href="{% url 'users-register' %}" class="nav__cta">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026. Мой блог.</p>
    </footer>
</body>
</html>
